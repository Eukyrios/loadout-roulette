<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Loadout Roulette">
  <!-- Delta Force palette: Ebony ground, Spring Green wheel.
       A roulette wheel from above is a ring, four spokes and a hub — which at
       this size is all that survives anyway. Strokes are deliberately heavy and
       the mark runs close to the edges, because the browser renders this at
       16px and anything finer silts up. An earlier pass added a white ball on
       the rim; at 16px it stopped reading as a ball and just looked like a
       chipped pixel, so it is gone. -->
  <rect width="32" height="32" rx="6" fill="#060e13"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#0ff796" stroke-width="3"/>
  <path d="M16 2.6v5.2M16 24.2v5.2M2.6 16h5.2M24.2 16h5.2"
        stroke="#0ff796" stroke-width="3" stroke-linecap="round"/>
  <circle cx="16" cy="16" r="3.2" fill="#0ff796"/>
</svg>
